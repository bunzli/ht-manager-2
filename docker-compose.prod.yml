services:
  ht-manager:
    image: ghcr.io/bunzli/ht-manager-2:latest
    container_name: ht-manager
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      # Inject this only through Dockge's secret/environment configuration.
      - DATABASE_URL
      - CHPP_CONSUMER_KEY=${CHPP_CONSUMER_KEY}
      - CHPP_CONSUMER_SECRET=${CHPP_CONSUMER_SECRET}
      - CHPP_ACCESS_TOKEN=${CHPP_ACCESS_TOKEN}
      - CHPP_ACCESS_TOKEN_SECRET=${CHPP_ACCESS_TOKEN_SECRET}
      - CHPP_TEAM_ID=${CHPP_TEAM_ID}
    networks:
      - shared_backend
    depends_on:
      ht-manager-db-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  ht-manager-db-migrate:
    image: ghcr.io/bunzli/ht-manager-2:latest
    entrypoint: ["/usr/local/bin/migrate-sqlite-to-postgres"]
    command: []
    # The named backup volume is created as root; the application remains non-root.
    user: "0:0"
    volumes:
      - ht-manager-data:/source:ro
      - ht-manager-sqlite-backup:/backup
    environment:
      # Inject this only through Dockge's secret/environment configuration.
      - DATABASE_URL
    networks:
      - shared_backend
    restart: "no"

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower-ht-manager
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 300 ht-manager
    depends_on:
      ht-manager:
        condition: service_healthy
    restart: unless-stopped

volumes:
  # Retained after cutover; it remains the SQLite rollback source.
  ht-manager-data:
  ht-manager-sqlite-backup:

networks:
  shared_backend:
    external: true
    name: shared_backend
